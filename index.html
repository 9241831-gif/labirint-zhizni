<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Лабиринт жизни</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;font-family:Georgia,serif;color:#f9edce;background:radial-gradient(ellipse at 50% 10%,#43306b 0%,#1a1236 45%,#080916 100%);min-height:100vh}.stars{position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(1px 1px at 10% 20%,#fff 90%,transparent),radial-gradient(2px 2px at 80% 12%,#ffe8ad 90%,transparent),radial-gradient(1px 1px at 30% 70%,#fff 90%,transparent),radial-gradient(2px 2px at 75% 78%,#fff 90%,transparent);background-size:180px 220px;opacity:.7}.wrap{position:relative;max-width:560px;margin:auto;padding:28px 16px 45px}h1{text-align:center;font-size:31px;color:#f6d994;text-shadow:0 0 18px #a86aff;margin:10px 0 5px}p.lead{text-align:center;color:#d6c4ed;margin:0 0 20px}.progress{background:#241c41;border:1px solid #9371b2;border-radius:15px;padding:12px 16px;text-align:center}.track{height:9px;background:#100d25;border-radius:9px;margin-top:10px;overflow:hidden}.fill{height:100%;width:0;background:linear-gradient(90deg,#a86ee7,#f3d081);transition:width .3s}.map{position:relative;margin:22px auto 10px;display:grid;gap:14px;max-width:400px}.map:before{content:'';position:absolute;left:50%;top:15px;bottom:15px;border-left:2px dashed #b99460;opacity:.65}.portal{position:relative;display:flex;align-items:center;gap:14px;width:87%;min-height:78px;padding:12px 15px;border-radius:18px;background:linear-gradient(125deg,#332253,#1d173a);border:1px solid #9a75bc;color:#f5e6c3;text-align:left;box-shadow:0 0 20px #8d55c122;cursor:pointer}.portal:nth-child(even){margin-left:auto;flex-direction:row-reverse;text-align:right}.portal .orb{display:grid;place-items:center;flex:0 0 52px;height:52px;border:2px solid #dbb974;border-radius:50%;font-size:27px;background:#31234c;box-shadow:0 0 18px #d9b65b55}.portal strong{display:block;font-size:16px}.portal small{display:block;color:#cdb6e3;margin-top:5px;font-size:12px}.portal.locked{filter:grayscale(.7);opacity:.65}.portal.done{border-color:#d9ba73}.details{margin-top:18px;border:1px solid #9875b5;border-radius:16px;background:#1a1532;padding:18px;line-height:1.5}.details h2{font-size:19px;margin:0 0 8px;color:#f3d18a}.details p{margin:0 0 12px}.hint{color:#c7b6dc;font-size:13px}.action{background:#d8b879;color:#251836;border:0;padding:12px 16px;border-radius:10px;font-weight:bold;cursor:pointer;width:100%}footer{text-align:center;color:#a99abb;font-size:12px;margin-top:20px}</style></head><body><div class="stars"></div><main class="wrap"><h1>✧ Лабиринт жизни ✧</h1><p class="lead">Семь миров · Семь ключей · Твой путь</p><section class="progress"><span id="counter">Демонстрация карты · 0 из 7 ключей</span><div class="track"><div class="fill" id="fill"></div></div></section><section class="map" id="map"></section><section class="details" id="details"><h2>🌙 Добро пожаловать</h2><p>Прикоснись к одному из семи порталов, чтобы узнать о мире.</p><p class="hint">Это демонстрационная карта. Прогресс пока не связан с Telegram-ботом.</p></section><footer>Лабиринт жизни · Демонстрационная версия Mini App</footer></main><script>const worlds=[['🪞','Зеркало прошлого','Осознание','Исследование прошлого и важных открытий.'],['🌑','Тень страхов','Принятие','Бережная встреча со страхами и сомнениями.'],['🔱','Перекрёсток выбора','Освобождение','Поиск собственного направления.'],['🌀','Тупики сценариев','Выбор','Выход из повторяющихся сценариев.'],['🌿','Сад ресурсов','Смелость','Внутренние опоры и дерево силы.'],['🌌','Звёздная дорога','Сила','Созвездие будущего и первый шаг.'],['🚪','Врата новой жизни','Созидание','Итоги путешествия и новый путь.']];const map=document.getElementById('map');worlds.forEach((w,i)=>{const b=document.createElement('button');b.className='portal';b.innerHTML='<span class="orb">'+w[0]+'</span><span><strong>Мир '+(i+1)+'. '+w[1]+'</strong><small>🗝 '+w[2]+'</small></span>';b.onclick=()=>{document.getElementById('details').innerHTML='<h2>'+w[0]+' '+w[1]+'</h2><p>'+w[3]+'</p><p class="hint">Ключ мира: '+w[2]+'</p><p class="hint">Игровые задания пока доступны в основном Telegram-боте. Следующим этапом подключим карту к сохранённому прогрессу.</p><button class="action" id="back">Вернуться к карте</button>';document.getElementById('back').onclick=()=>document.getElementById('details').scrollIntoView({behavior:'smooth'});document.getElementById('details').scrollIntoView({behavior:'smooth'})};map.appendChild(b)});if(window.Telegram?.WebApp){Telegram.WebApp.ready();Telegram.WebApp.expand()}</script></body></html>
